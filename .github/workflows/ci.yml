name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Registry 索引是 https://mooncakes.io/git/index 上的一个 git 仓库（约 9 MB）。
      # 不缓存的话每次 CI 都要重新克隆，从 Actions runner 访问偶发超时
      # （实测出现过一次耗时 7 分 54 秒后失败）。
      # 缓存后只需拉取增量，既快又稳。
      - name: Cache MoonBit registry
        uses: actions/cache@v4
        with:
          path: ~/.moon/registry
          key: moonbit-registry-${{ runner.os }}-${{ hashFiles('moon.mod') }}
          restore-keys: |
            moonbit-registry-${{ runner.os }}-

      # 工具链下载是必需步骤，偶发失败时重试；全部失败则真的失败。
      - name: Set up MoonBit
        run: |
          ok=0
          for i in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 https://cli.moonbitlang.cn/install/unix.sh | bash; then
              ok=1
              break
            fi
            echo "MoonBit install attempt $i failed; retrying in 15s"
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "MoonBit install failed after 3 attempts" >&2
            exit 1
          fi
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      # `moon update` 只是刷新 registry 索引，**不是**依赖是否可用的权威判据。
      # 权威判据是下面的 `moon check` —— 依赖真装不上时它会失败。
      # 因此这一步降级为非致命：否则一个"刷新索引"的动作会把整个构建判死。
      - name: Update dependencies
        run: |
          moon update || echo "::warning::moon update failed; continuing with the cached registry"

      # `moon version --all` 会联网查询各后端版本，纯诊断用途；
      # 失败时退回本地 `moon version`。
      - name: Show toolchain version
        run: moon version --all || moon version

      # 这一步才是真正的门禁：依赖解析不了、类型检查不过，都会在这里失败。
      - name: Check
        run: moon check

      - name: Build (native)
        run: moon build --target native

      # 端到端验证协议行为（含"通知不得被回应"这类易错点）。
      # 见 docs/demo.md —— 评审也可以本地复跑同一个脚本。
      - name: MCP protocol smoke test
        run: sh scripts/smoke.sh

      - name: Test (default target)
        run: moon test

      - name: Test (native)
        run: moon test --target native
