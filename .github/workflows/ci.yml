name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.cn/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update dependencies
        run: moon update

      # `moon version --all` 会访问网络查询各后端版本，偶发失败；
      # 这里降级为非致命，失败时退回本地 `moon version`，
      # 避免一个纯诊断步骤把整个构建判为失败。
      - name: Show toolchain version
        run: moon version --all || moon version

      - name: Check
        run: moon check

      - name: Build (native)
        run: moon build --target native

      - name: Test (default target)
        run: moon test

      - name: Test (native)
        run: moon test --target native
