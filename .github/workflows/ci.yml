name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 工具链下载偶发失败（实测 6 次运行里出现过 1 次）。
      # 这里重试 3 次；若全部失败仍然让步骤失败，不掩盖真实故障。
      - name: Set up MoonBit
        run: |
          ok=0
          for i in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 https://cli.moonbitlang.cn/install/unix.sh | bash; then
              ok=1
              break
            fi
            echo "MoonBit install attempt $i failed; retrying in 10s"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "MoonBit install failed after 3 attempts" >&2
            exit 1
          fi
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      # `moon update` 需要访问 registry，同样存在偶发失败。
      - name: Update dependencies
        run: |
          ok=0
          for i in 1 2 3; do
            if moon update; then
              ok=1
              break
            fi
            echo "moon update attempt $i failed; retrying in 10s"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "moon update failed after 3 attempts" >&2
            exit 1
          fi

      # `moon version --all` 会联网查询各后端版本，偶发失败；
      # 降级为非致命，失败时退回本地 `moon version`，
      # 避免一个纯诊断步骤把整个构建判为失败。
      - name: Show toolchain version
        run: moon version --all || moon version

      - name: Check
        run: moon check

      - name: Build (native)
        run: moon build --target native

      # 端到端验证协议行为（含"通知不得被回应"这类易错点）。
      # 见 docs/demo.md —— 评审也可以本地复跑同一个脚本。
      - name: MCP protocol smoke test
        run: sh scripts/smoke.sh

      - name: Test (default target)
        run: moon test

      - name: Test (native)
        run: moon test --target native
